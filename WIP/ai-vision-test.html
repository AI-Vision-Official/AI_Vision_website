<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Vision - Floating Cards</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to bottom, #000428, #004e92);
      overflow-x: hidden;
      color: white;
    }

    .scene {
      perspective: 1200px;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .table {
      width: 90vw;
      height: 70vh;
      position: relative;
      transform-style: preserve-3d;
      transform: rotateX(25deg) rotateZ(-15deg);
    }

    .card {
      width: 220px;
      height: 140px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform-style: preserve-3d;
      transform: translate(-50%, -50%) scale(1);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .card:hover {
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 6px 30px rgba(255, 255, 255, 0.2);
    }

    .card:nth-child(1) { transform: translate(-160%, -100%) rotateY(5deg) rotateX(5deg); }
    .card:nth-child(2) { transform: translate(-60%, -80%) rotateY(3deg) rotateX(3deg); }
    .card:nth-child(3) { transform: translate(40%, -100%) rotateY(-3deg) rotateX(-2deg); }
    .card:nth-child(4) { transform: translate(-90%, 30%) rotateY(2deg) rotateX(2deg); }
    .card:nth-child(5) { transform: translate(70%, 40%) rotateY(-4deg) rotateX(1deg); }

    .globe {
      position: absolute;
      top: 20px;
      right: 40px;
      width: 100px;
      height: 100px;
      background-image: url('AI Vision Logo.png');
      background-size: cover;
      border-radius: 50%;
      transition: transform 0.5s ease;
    }

    .globe:hover {
      transform: scale(1.2) rotate(10deg);
    }

    @media (max-width: 768px) {
      .table {
        transform: rotateX(15deg) rotateZ(0deg);
      }
      .card {
        width: 160px;
        height: 100px;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="table">
      <div class="card" onclick="location.href='dream-builder.html'">Dream Builder</div>
      <div class="card" onclick="location.href='energy-flow.html'">Energy Flow</div>
      <div class="card" onclick="location.href='vision-gallery.html'">Vision Gallery</div>
      <div class="card" onclick="location.href='co-creation-lab.html'">Co-Creation Lab</div>
      <div class="card" onclick="location.href='why-i-exist.html'">Why I Exist</div>
      <div class="globe" onclick="location.href='home.html'"></div>
    </div>
  </div>
</body>
</html>

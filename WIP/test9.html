<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Globe Homepage</title>
  <style>
    :root {
      --card-color: rgba(0, 150, 255, 0.1);
      --card-border: rgba(0, 150, 255, 0.4);
      --glow: rgba(0, 150, 255, 0.8);
    }
    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle, #001a33 0%, #000c1a 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    .scene {
      position: relative;
      width: 100%;
      max-width: 1200px;
      height: 700px;
      perspective: 1200px;
    }
    .globe {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotateY(0deg);
      width: 250px;
      height: 250px;
      border-radius: 50%;
      background: radial-gradient(circle at center, #0088cc, #004466);
      box-shadow: 0 0 60px var(--glow);
      animation: spin 40s linear infinite;
      z-index: 1;
    }
    @keyframes spin {
      from { transform: translate(-50%, -50%) rotateY(0deg); }
      to { transform: translate(-50%, -50%) rotateY(360deg); }
    }
    .card {
      position: absolute;
      width: 180px;
      height: 120px;
      background: var(--card-color);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 12px rgba(0, 150, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px var(--glow);
    }
    .europe { top: 50%; left: 50%; transform: translate(-300%, -100%); }
    .africa { top: 50%; left: 50%; transform: translate(200%, -20%); }
    .asia { top: 50%; left: 50%; transform: translate(100%, 150%); }
    .south-america { top: 50%; left: 50%; transform: translate(-150%, 200%); }
    .north-america { top: 50%; left: 50%; transform: translate(-450%, 50%); }
  </style>
</head>
<body>
  <div class="scene">
    <div class="globe"></div>
    <div class="card europe" onclick="location.href='europe.html'">Europe</div>
    <div class="card africa" onclick="location.href='africa.html'">Africa</div>
    <div class="card asia" onclick="location.href='asia.html'">Asia-Pacific</div>
    <div class="card south-america" onclick="location.href='south-america.html'">South America</div>
    <div class="card north-america" onclick="location.href='north-america.html'">North America</div>
  </div>
</body>
</html>

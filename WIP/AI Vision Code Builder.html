<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Code Builder</title>
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --text: #ffffff;
      --highlight: #00bcd4;
    }
    body {
      margin: 0;
      font-family: sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .editor, .preview {
      flex: 1;
      padding: 1rem;
      box-sizing: border-box;
    }
    .editor {
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    textarea {
      width: 100%;
      height: 200px;
      background: #222;
      color: white;
      border: none;
      padding: 1rem;
      font-family: monospace;
      resize: vertical;
    }
    iframe {
      width: 100%;
      height: 100%;
      background: white;
      border: none;
    }
    select, button {
      padding: 0.5rem;
      font-size: 1rem;
      border-radius: 5px;
      border: none;
      background: var(--highlight);
      color: #000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="editor">
    <label for="element-type">Choose element type:</label>
    <select id="element-type">
      <option value="header">Header</option>
      <option value="section">Section</option>
      <option value="footer">Footer</option>
      <option value="button">Button</option>
    </select>

    <textarea id="html-code" placeholder="Write your HTML here..."></textarea>
    <textarea id="css-code" placeholder="Write your CSS here..."></textarea>
    <button onclick="updatePreview()">Update Preview</button>
    <button onclick="downloadTemplate()">Download Template</button>
  </div>
  <div class="preview">
    <iframe id="live-preview"></iframe>
  </div>

  <script>
    function updatePreview() {
      const html = document.getElementById('html-code').value;
      const css = `<style>${document.getElementById('css-code').value}</style>`;
      const previewFrame = document.getElementById('live-preview');
      const content = `<!DOCTYPE html><html><head>${css}</head><body>${html}</body></html>`;
      previewFrame.srcdoc = content;
    }

    function downloadTemplate() {
      const html = document.getElementById('html-code').value;
      const css = document.getElementById('css-code').value;
      const blob = new Blob([
        `<!DOCTYPE html>\n<html>\n<head>\n<style>\n${css}\n</style>\n</head>\n<body>\n${html}\n</body>\n</html>`
      ], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'my-template.html';
      a.click();
    }
  </script>
</body>
</html>
